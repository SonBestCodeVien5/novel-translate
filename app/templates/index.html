{% extends 'base.html' %}{% block content %}<h1>Sách local</h1><ul>{% for book in books %}<li><a href="/books/{{ book.id }}">{{ book.title }}</a></li>{% else %}<li>Chưa có sách.</li>{% endfor %}</ul><h2>Nhập TXT</h2><p>Tệp UTF-8 tối đa 1 MiB. Chỉ nhập nội dung bạn có quyền sử dụng.</p><form action="/preview" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="title">Tên sách</label><input id="title" name="title" required maxlength="200"><label for="file">Tệp TXT</label><input id="file" name="file" type="file" accept=".txt,text/plain" required><label><input name="split_headings" type="checkbox" checked> Tách theo heading chương (bỏ chọn để dùng một chương)</label><button>Xem trước chương</button></form><h2>Nhập result JSON</h2><form action="/results" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="result">Tệp kết quả tối đa 1 MiB</label><input id="result" name="file" type="file" accept=".json,application/json" required><button>Kiểm tra và nhập kết quả</button></form>{% endblock %}
